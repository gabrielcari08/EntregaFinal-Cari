{% extends 'base.html' %}

{% block content %}
<h2>Confirmar eliminación</h2>
<p>¿Estás seguro de que quieres eliminar este mensaje para {{ message.receiver.username }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Eliminar</button>
    <a href="{% url 'inbox' %}">Cancelar</a>
</form>
{% endblock %}
